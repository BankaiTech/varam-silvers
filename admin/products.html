<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Varam Silvers Admin - Products</title>
    <link rel="stylesheet" href="css/admin.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <!-- Admin Navbar -->
    <nav class="admin-navbar">
        <div class="navbar-brand">
            <img src="../public/images/varam_silvers_logo.png" alt="Varam Silvers" class="brand-logo">
            <span class="brand-text">Varam Silvers Admin</span>
        </div>
        <div class="navbar-menu" id="navbarMenu">
            <a href="index.html" class="nav-link">Home</a>
            <a href="products.html" class="nav-link active">Products</a>
            <a href="add-product.html" class="nav-link">Add Product</a>
            <a href="inventory.html" class="nav-link">Inventory</a>
        </div>
        <button class="mobile-menu-toggle" id="mobileMenuToggle">
            <span></span>
            <span></span>
            <span></span>
        </button>
    </nav>

    <!-- Main Content -->
    <main class="admin-main">
        <div class="page-header">
            <h1>Products</h1>
            <p>Manage your product catalog</p>
        </div>

        <!-- Search and Filters -->
        <div class="page-controls">
            <div class="search-container">
                <input type="text" id="productSearch" placeholder="Search products..." class="search-input">
                <button class="search-btn">🔍</button>
            </div>
            <div class="filter-container">
                <select id="categoryFilter" class="filter-select">
                    <option value="">All Categories</option>
                    <option value="Chains">Chains</option>
                    <option value="Rings">Rings</option>
                    <option value="Earrings">Earrings</option>
                    <option value="Pendants">Pendants</option>
                    <option value="Bracelets">Bracelets</option>
                </select>
                <select id="materialFilter" class="filter-select">
                    <option value="">All Materials</option>
                    <option value="Silver">Silver</option>
                    <option value="Gold">Gold</option>
                    <option value="Rose Gold">Rose Gold</option>
                </select>
            </div>
        </div>

        <!-- Products Table -->
        <div class="dashboard-section">
            <div class="section-header">
                <h3>Product List</h3>
                <a href="add-product.html" class="add-product-btn">+ Add New Product</a>
            </div>
            <div class="section-content">
                <div class="data-table-container">
                    <table class="data-table" id="productsTable">
                        <thead>
                            <tr>
                                <th data-sort="id">ID</th>
                                <th data-sort="name">Name</th>
                                <th data-sort="category">Category</th>
                                <th data-sort="materials">Material(s)</th>
                                <th data-sort="price">Current Price</th>
                                <th data-sort="stock">Stock</th>
                                <th>Actions</th>
                            </tr>
                        </thead>
                        <tbody>
                            <tr class="loading-row">
                                <td colspan="7" class="loading-cell">
                                    <div class="loading-spinner"></div>
                                    Loading products...
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                
                <!-- Pagination -->
                <div class="pagination-container">
                    <div class="pagination-info">
                        <span id="paginationInfo">Showing 0 of 0 products</span>
                    </div>
                    <div class="pagination-controls">
                        <button id="prevPage" class="pagination-btn" disabled>Previous</button>
                        <div class="pagination-pages" id="paginationPages"></div>
                        <button id="nextPage" class="pagination-btn" disabled>Next</button>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <!-- Toast Container -->
    <div id="toastContainer" class="toast-container"></div>

    <script src="js/admin.js"></script>
    <script src="js/pages/products.js"></script>
</body>
</html>
